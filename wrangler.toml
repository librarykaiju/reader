name = "reader"
main = "src/index.js"
compatibility_date = "2026-09-01"

# A private feed and ebook reader at https://reader.brandonj.ink (add that as
# a Custom Domain on the Worker). Everything under /api/ needs READER_TOKEN.

# The live "reader" database. A fresh one (`npx wrangler d1 create reader`,
# then put its id here) gets its tables from schema.sql:
#   npx wrangler d1 execute reader --remote --file schema.sql
# Upgrades to an existing one are in migrations/, run before deploying.
[[d1_databases]]
binding = "DB"
database_name = "reader"
database_id = "0001e946-d815-406b-8d8e-b8863b8dc2db"

# Create with `npx wrangler r2 bucket create reader-books`. Private: books are
# only ever served through the Worker, never from a public bucket URL.
[[r2_buckets]]
binding = "BOOKS"
bucket_name = "reader-books"

# Your name, on the family library's welcome page ("Welcome to Brandon's
# library"). Leave it out and the page just says "the library".
[vars]
OWNER_NAME = "Brandon"
# Cloudflare Turnstile on the library card request form (docs/setup.md,
# "Family library"): the widget's site key here, and its secret key with
#   npx wrangler secret put TURNSTILE_SECRET
# Leave it out and the form works without the check.
TURNSTILE_SITE_KEY = "0x4AAAAAAFrq7rE_nOxB_Qvu"

# Audiobooks from Audiobookshelf (docs/setup.md, "Audiobooks"): new and
# changed ones every 30 minutes. Does nothing until ABS_URL and ABS_TOKEN are set.
[triggers]
crons = ["*/30 * * * *"]

# Workers AI, for "Compare coverage" (docs/setup.md, Part 7). In the
# dashboard: Settings -> Bindings -> Add binding -> Workers AI, name AI.
[ai]
binding = "AI"

# Secret (not stored here) -- set with `npx wrangler secret put READER_TOKEN`:
#   READER_TOKEN  -- any long random string; the page asks for it once per
#                    device and sends it as a Bearer token
#   ANTHROPIC_API_KEY -- optional; "Compare coverage" uses Claude instead,
#                        but only when there's no AI binding (docs/setup.md, Part 7)
#                        It also picks the family library's appeal terms
#                        (Workers AI does when it isn't set).
#   ABS_URL, ABS_TOKEN -- optional; Audiobookshelf's tunnel address and an API key
#                         for a read-only user there (docs/setup.md, "Audiobooks")
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET -- the Cloudflare Access service
#                         token in front of ABS_URL
#
# Dev only (put it in .dev.vars, never in production):
#   ALLOW_PRIVATE_FETCH = "1"  -- lets /api/fetch reach localhost/private IPs
#                                 so local test fixtures can be read
